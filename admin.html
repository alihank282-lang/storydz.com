<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد موقع StoryDZ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <h1>🏗️ مولّد موقع StoryDZ</h1>
  <span class="badge">HTML5 خالص</span>
</header>

<main class="admin-main">

  <section class="panel">
    <h2>⚙️ الإعدادات العامة</h2>
    <label>اسم الموقع
      <input type="text" id="siteName" value="StoryDZ">
    </label>
    <label>النطاق (Domain)
      <input type="text" id="domain" value="https://storydz.com">
    </label>
    <label>معرّف AdSense (ca-pub-...)
      <input type="text" id="adsenseClient" placeholder="ca-pub-XXXXXXXXXXXXXXXX">
    </label>
    <label>البريد الإلكتروني للتواصل
      <input type="email" id="contactEmail" value="contact@storydz.com">
    </label>
  </section>

  <section class="panel">
    <h2>ℹ️ صفحة "من نحن"</h2>
    <label>نص "من نحن" (عربي)
      <textarea id="aboutAr" rows="3">StoryDZ منصة قصصية جزائرية تهدف إلى حفظ الحكايات الشعبية والقصص المعاصرة.</textarea>
    </label>
    <label>About text (English)
      <textarea id="aboutEn" rows="2">StoryDZ is an Algerian storytelling platform dedicated to preserving folk tales.</textarea>
    </label>
    <label>Texte À propos (Français)
      <textarea id="aboutFr" rows="2">StoryDZ est une plateforme algérienne de narration dédiée à la préservation des contes.</textarea>
    </label>
  </section>

  <section class="panel">
    <h2>📚 القصص</h2>
    <form id="storyForm">
      <label>العنوان (عربي) <input type="text" id="titleAr" required></label>
      <label>Title (English) <input type="text" id="titleEn"></label>
      <label>Titre (Français) <input type="text" id="titleFr"></label>
      <label>اسم الكاتب <input type="text" id="author" placeholder="اسم الكاتب"></label>
      <label>اسم ملف الغلاف (مثال: cover-01.jpg) <input type="text" id="cover" value="cover-01.jpg"></label>
      
      <label>النص العربي (الأساسي) <textarea id="contentAr" rows="5" required></textarea></label>
      <label>English text <textarea id="contentEn" rows="3"></textarea></label>
      <label>Texte français <textarea id="contentFr" rows="3"></textarea></label>
      
      <button type="submit" class="btn-primary">➕ إضافة القصة</button>
    </form>
    <h3 style="margin-top:1.5rem;">القصص المضافة (<span id="storyCount">0</span>)</h3>
    <div id="storyList" class="story-list"></div>
  </section>

  <section class="panel highlight">
    <h2>🚀 توليد الموقع</h2>
    <p>سيتم توليد كل ملفات HTML (عربي، إنجليزي، فرنسي) في ملف ZIP واحد.</p>
    <button id="generateAll" class="btn-generate">📦 توليد وتنزيل الموقع (ZIP)</button>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="admin.js"></script>
</body>
                               </html>
